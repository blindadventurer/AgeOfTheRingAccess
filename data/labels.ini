; Spoken names for map objects the game gives no useful name, by template.
; Format: Template = words (UTF-8). Lines starting with ; are comments.
; The scanner lists these objects in the "цели" category even when they are not selectable.
;
; map good council of elrond, Bilbo's riddles in the dark (scripts "Bilbo - Riddle 0N -
; Answer Spawn 01..03" place three floor pictures on "Gollum - Waypoint Answer 01..03";
; the wrong ones belong to teams named after their picture: "Riddle - Castle", "Riddle - Tree",
; "Riddle - Frost", "Riddle - Bat", "Riddle - Sun", "Riddle - Sea"; the right one belongs to
; teamPlyrCivilian; its picture is the classic answer of the riddle in map.str).
; The scripts "Bilbo - Riddle Check - Bat/Castle/Frost/Sea/Sun/Tree" sit in the group
; "Bilbo - Fail - Riddle Check": those pictures fail. "| auto": the mod walks the hero
; onto the right picture as soon as it appears (player's request 2026-11-01).
CampaignRiddlesInTheDark05 = рисунок: гора | auto
CampaignRiddlesInTheDark03 = рисунок: замок
CampaignRiddlesInTheDark07 = рисунок: дерево
CampaignRiddlesInTheDark09 = рисунок: ветер | auto
CampaignRiddlesInTheDark04 = рисунок: иней
CampaignRiddlesInTheDark02 = рисунок: летучая мышь
CampaignRiddlesInTheDark06 = рисунок: время | auto
CampaignRiddlesInTheDark01 = рисунок: солнце
CampaignRiddlesInTheDark08 = рисунок: море

; Age of the Ring quest markers (AotRMinasTirithProps.ini; spawned by mission scripts,
; e.g. "Dots - Gandalf" over each character the player can talk to). The scanner adds
; the name of the nearest character or object.
AotRDialogueDots = разговор
AotRQuestMarker = метка задания
AotRQuestHandin = сдать задание
; The game's own "go here" light (system.ini, Side Civilian, not selectable). Mission scripts create it
; 262 times in 37 missions (Gladden Fields: "Spotlight 01" at the forest after hint Elendur02) and
; delete it when the player arrives: 230 of 231 named ones.
InGameMarker = метка игры
InGameMarker2 = метка игры
; Gandalf's song notes (Long Expected Party): picked up in the intro, out of reach later.
AotRGandalfSongNotes = ноты песни Гандальфа, нужны только в начале миссии

; Stealth objectives, read after guides.ini and guides-auto.ini and added to their guides (UTF-8).
; danger = metres: the distance at which the mission's scripts count the hero as noticed
; ("G ... Spotted": DISTANCE_BETWEEN_TEAM <patrol> <hero>). threat = template the sides do not
; show as an enemy. Radii read from the map scripts 2026-11-04.

; map good amon hen: Patrol 01-08, 7 m from Frodo; ability The One Ring (HIDDEN) resets them.
[SCRIPT:Objective04_Amon]
danger = 7
say = Патрули замечают Фродо с 7 метров, мод предупредит заранее. Кольцо, клавиша R, делает Фродо невидимым. Камень Lure отвлекает патруль в радиусе 15 метров.

; map good long expected party: Lobelia and Otho, 10 m from Frodo.
[SCRIPT:BonusObjective01_Party]
danger = 10
threat = AotRHobbitLobeliaSackvilleBaggins
threat = AotRHobbitOthoSackvilleBaggins
say = Лобелия и Ото замечают Фродо с 10 метров, мод предупредит заранее. Если они рядом, нажмите T, Evade Lobelia, и стойте на месте.


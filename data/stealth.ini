; map good eaves of fangorn: the villages' fires are CINE_ParticleSysProxy 1-3 (named "Village 0N
; - Fire NN", scripts "Villages - Fires Extinguished 0N"); Rohan water carts ("Water Porter Village
; 0N", RohanPorter on the player's team) come after the raiders fall, a new one when one dies.
; Weapon PorterFireExtinguisher: radius 100, reload 5 s. The plots go to the player afterwards.
[SCRIPT:Objective02_Eaves]
object = CINE_ParticleSysProxy | огонь
object = CINE_ParticleSysProxy2 | огонь
object = CINE_ParticleSysProxy3 | огонь
[SCRIPT:Objective03_Eaves]
say = Деревни горят. Строить там можно, только когда все огни деревни погашены. Тушат водовозы: они приезжают, когда налётчики разбиты, и появляются в категории мои. Выделите водовоза. Режим команд, кнопка Extinguish Fire, End, выберите огонь, снова End. Один раз гасит всё в радиусе 10 метров. Огни перечислены в целях.
object = CINE_ParticleSysProxy | огонь
object = CINE_ParticleSysProxy2 | огонь
object = CINE_ParticleSysProxy3 | огонь

; map good pelargir: "Pelargir - Stealth - Main Gate Lever": Aragorn in "Area - Pelargir - Gate Main
; Lever" gives the player the lever "Pelargir - Gate Main Lever" (AOTROsgiliathSecretDoor, "Winch",
; side Civilian, button Command_ToggleGate family, upgrade Upgrade_MiniHordeLvl3 = open).
[SCRIPT:Objective04_RotK]
say = Ворота открывает рычаг Winch. Подведите Арагорна к рычагу, он в целях. Тогда Winch появится в категории мои. Выделите его, режим команд, нажмите кнопку открытия ворот.


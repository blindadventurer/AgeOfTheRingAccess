; Eternal stealth (training menu): the scripts of each mission that notice the player's heroes.
; While it is on, their conditions count as false, so the alarm never starts. Read by hand from the
; map scripts 2026-11-07 (scratch catch.py, cand.py). None has an ELSE branch, and each is the alarm
; a clean run never meets, so a mission must go on without it. Only the alarm is listed: a script
; that resets a patrol, a lure, or a scene the story needs stays. One name a line (UTF-8).

; Patrol 01-08 near Frodo: "Frodo - Spotted" sends him back to the start. The map's own
; "Debug - Easy Mode!" switches off this same script.
[map good amon hen]
G Hobbits Spotted

; Merry and Pippin in Fangorn, patrols and guards. Being seen only starts the chase and loses a bonus.
[map good eaves of fangorn]
G Fangorn - Hobbits Spotted

; Dead Marshes. "Attack" (Hobbits Near and one of the three NOT INSIDE_GARRISON -> attitude 2) is held
; back, and still the Nazgul went for the party (player, test 2026-11-08 01:14-01:36; immortality and the
; kill item were needed). So "Leave" is made true once a MordorFellBeast is within 300 of the party (the
; distance of "Spotted"): Flee All recruits it into "Nazgul Flee", attitude -3, relation Friend, and it flies
; off. "Return" is held back: it puts the Nazgul back on its hostile team while the hobbits stand in the open.
; "Spotted" stays (it guards Leave's flags, and the map's own path through Nazgul Off needs it).
; A line "+Script | Template range" makes a script true while that template stands near the own units.
[map good taming of smeagol]
G Nazgul Attack
G Nazgul Return
+G Nazgul Leave | MordorFellBeast 300

